<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התפריט שלנו</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; color: #333; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-content { padding: 15px; text-align: center; }
        .card-title { font-size: 1.4em; margin: 10px 0; color: #222; }
        .card-price { font-size: 1.2em; color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ התפריט הדינמי שלנו</h1>
        <div id="menu-display" class="menu-grid">
            </div>
    </div>

    <script>
        function loadMenu() {
            const menuDisplay = document.getElementById('menu-display');
            const items = JSON.parse(localStorage.getItem('restaurantMenu')) || [];
            
            if (items.length === 0) {
                menuDisplay.innerHTML = '<p>התפריט כרגע ריק. היכנס לדף הניהול כדי להוסיף מנות.</p>';
                return;
            }

            menuDisplay.innerHTML = items.map(item => `
                <div class="card">
                    <img src="${item.image || 'https://via.placeholder.com/200'}" alt="${item.name}">
                    <div class="card-content">
                        <div class="card-title">${item.name}</div>
                        <div class="card-price">₪${item.price}</div>
                    </div>
                </div>
            `).join('');
        }

        // טעינה ראשונית ועדכון בזמן אמת אם הדף פתוח
        loadMenu();
        window.addEventListener('storage', loadMenu);
    </script>
</body>
</html>
