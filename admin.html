<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול תפריט - תצוגה מקופלת</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 20px; direction: rtl; }
        .admin-card { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        
        /* עיצוב הטופס */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        
        .image-box { border: 2px dashed #3498db; padding: 10px; text-align: center; background: #fff; cursor: pointer; transition: 0.3s; }
        .image-box:hover { background: #e8f4fd; }

        .btn-add { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 1.1em; }
        .btn-update { background: #2980b9; color: white; display: none; }

        /* עיצוב רשימת פריטים (Accordion) */
        .category-group { margin-top: 10px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .category-header { 
            background: #34495e; color: white; padding: 12px; cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center; font-weight: bold;
        }
        .category-content { display: none; background: white; padding: 10px; }
        .category-group.active .category-content { display: block; }
        .category-group.active .category-header { background: #2c3e50; }

        .item-row { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .item-row:last-child { border-bottom: none; }
        .item-img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-left: 15px; }
        .item-info { flex-grow: 1; }
        
        .btn-sm { width: auto; padding: 5px 10px; margin-right: 5px; cursor: pointer; border: none; border-radius: 4px; color: white; }
        .btn-edit { background: #f39c12; }
        .btn-del { background: #e74c3c; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>🛠️ ניהול תפריט חכם</h2>

    <div id="editor-form">
        <input type="hidden" id="editId">
        <div class="form-grid">
            <div>
                <label>שם המנה:</label>
                <input type="text" id="itemName">
            </div>
            <div>
                <label>מחיר (₪):</label>
                <input type="number" id="itemPrice">
            </div>
            <div>
                <label>קטגוריה:</label>
                <select id="itemCategory">
                    <option value="ראשונות">ראשונות</option>
                    <option value="עיקריות">עיקריות</option>
                    <option value="קינוחים">קינוחים</option>
                    <option value="שתייה">שתייה</option>
                </select>
            </div>
            <div>
                <label>תמונה:</label>
                <div class="image-box" onclick="document.getElementById('imageFile').click()">
                    <span id="fileStatus">לחץ לבחירת קובץ 📁</span>
                    <input type="file" id="imageFile" accept="image/*" style="display:none" onchange="handleFile(this)">
                    <input type="hidden" id="itemBase64">
                </div>
            </div>
        </div>
        <button id="addBtn" onclick="addItem()" class="btn-add">➕ הוסף מנה</button>
        <button id="updateBtn" onclick="updateItem()" class="btn-update">💾 שמור שינויים</button>
        <button id="cancelBtn" onclick="resetForm()" style="display:none; margin-top:5px;">ביטול</button>
    </div>

    <hr style="margin: 25px 0;">

    <div id="accordion-container">
        </div>

    <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button onclick="saveToFile()" style="background:#34495e; color:white;">💾 הורד קובץ גיבוי</button>
        <input type="file" id="loadInput" style="display:none" onchange="loadFromFile(this)">
        <button onclick="document.getElementById('loadInput').click()" style="background:#7f8c8d; color:white;">📂 טען קובץ קיים</button>
    </div>
</div>

<script>
    let menuItems = JSON.parse(localStorage.getItem('restaurantMenu')) || [];

    function handleFile(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('itemBase64').value = e.target.result;
                document.getElementById('fileStatus').innerText = "✅ תמונה נבחרה";
            };
            reader.readAsDataURL(file);
        }
    }

    function render() {
        const container = document.getElementById('accordion-container');
        container.innerHTML = "";

        // קיבוץ הפריטים לפי קטגוריה
        const grouped = menuItems.reduce((acc, item) => {
            acc[item.category] = acc[item.category] || [];
            acc[item.category].push(item);
            return acc;
        }, {});

        const categories = ["ראשונות", "עיקריות", "קינוחים", "שתייה"];

        categories.forEach(cat => {
            const items = grouped[cat] || [];
            if (items.length === 0 && menuItems.length > 0) return;

            const groupDiv = document.createElement('div');
            groupDiv.className = "category-group";
            groupDiv.innerHTML = `
                <div class="category-header" onclick="this.parentElement.classList.toggle('active')">
                    <span>${cat} (${items.length})</span>
                    <span>▼</span>
                </div>
                <div class="category-content">
                    ${items.map(item => `
                        <div class="item-row">
                            <img src="${item.image || ''}" class="item-img" onerror="this.src='https://via.placeholder.com/50'">
                            <div class="item-info">
                                <strong>${item.name}</strong> - ₪${item.price}
                            </div>
                            <button class="btn-sm btn-edit" onclick="startEdit(${item.id})">ערוך</button>
                            <button class="btn-sm btn-del" onclick="deleteItem(${item.id})">מחק</button>
                        </div>
                    `).join('')}
                    ${items.length === 0 ? '<p style="color:#999; font-size:0.9em;">אין מנות בקטגוריה זו</p>' : ''}
                </div>
            `;
            container.appendChild(groupDiv);
        });

        localStorage.setItem('restaurantMenu', JSON.stringify(menuItems));
    }

    function addItem() {
        const name = document.getElementById('itemName').value;
        const price = document.getElementById('itemPrice').value;
        const category = document.getElementById('itemCategory').value;
        const image = document.getElementById('itemBase64').value;

        if(!name || !price) return alert("חובה למלא שם ומחיר");

        menuItems.push({ id: Date.now(), name, price, category, image });
        resetForm();
        render();
    }

    function startEdit(id) {
        const item = menuItems.find(i => i.id === id);
        document.getElementById('editId').value = item.id;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemCategory').value = item.category;
        document.getElementById('itemBase64').value = item.image || '';
        document.getElementById('fileStatus').innerText = item.image ? "✅ קיימת תמונה" : "לחץ לבחירת קובץ 📁";

        document.getElementById('addBtn').style.display = 'none';
        document.getElementById('updateBtn').style.display = 'block';
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateItem() {
        const id = parseInt(document.getElementById('editId').value);
        const index = menuItems.findIndex(i => i.id === id);
        if(index !== -1) {
            menuItems[index].name = document.getElementById('itemName').value;
            menuItems[index].price = document.getElementById('itemPrice').value;
            menuItems[index].category = document.getElementById('itemCategory').value;
            menuItems[index].image = document.getElementById('itemBase64').value;
            resetForm();
            render();
        }
    }

    function deleteItem(id) {
        if(confirm("למחוק מנה זו?")) {
            menuItems = menuItems.filter(i => i.id !== id);
            render();
        }
    }

    function resetForm() {
        document.getElementById('editId').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemBase64').value = '';
        document.getElementById('fileStatus').innerText = "לחץ לבחירת קובץ 📁";
        document.getElementById('addBtn').style.display = 'block';
        document.getElementById('updateBtn').style.display = 'none';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    function saveToFile() {
        const data = JSON.stringify(menuItems);
        const blob = new Blob([data], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'menu_db.json';
        a.click();
    }

    function loadFromFile(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            menuItems = JSON.parse(e.target.result);
            render();
        };
        reader.readAsText(input.files[0]);
    }

    render();
</script>
</body>
</html>
