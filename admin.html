<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול תפריט - GitHub DB</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; direction: rtl; }
        .admin-card { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .form-and-preview { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 25px; background: #fafafa; padding: 20px; border-radius: 15px; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input, select, textarea, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        .preview-area { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #ddd; border-radius: 10px; background: #fff; cursor: pointer; height: 100%; overflow: hidden; }
        .preview-img-big { max-width: 100%; max-height: 250px; border-radius: 8px; display: none; }
        .btn-add { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; padding: 15px; }
        .btn-update { background: #2980b9; color: white; display: none; padding: 15px; }
        .category-group { margin-top: 10px; border: 1px solid #eee; border-radius: 10px; overflow: hidden; }
        .category-header { background: #34495e; color: white; padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .category-content { display: none; background: white; padding: 10px; }
        .category-group.active .category-content { display: block; }
        .item-row { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #f1f1f1; }
        .item-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; margin-left: 15px; }
        .item-info { flex-grow: 1; }
        .status-bar { background: #2c3e50; color: white; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9em; text-align: center; }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="status-bar" id="statusMsg">מתחבר ל-GitHub...</div>
    <h2>🛠️ ניהול תפריט מבוסס ענן</h2>

    <div id="editor-form">
        <input type="hidden" id="editId">
        <div class="form-and-preview">
            <div class="form-grid">
                <div>
                    <label>שם המנה:</label>
                    <input type="text" id="itemName">
                </div>
                <div>
                    <label>מחיר (₪):</label>
                    <input type="number" id="itemPrice">
                </div>
                <div>
                    <label>קטגוריה:</label>
                    <select id="itemCategory">
                        <option value="ראשונות">ראשונות</option>
                        <option value="עיקריות">עיקריות</option>
                        <option value="קינוחים">קינוחים</option>
                        <option value="שתייה">שתייה</option>
                    </select>
                </div>
                <div>
                    <label>הסבר על המנה:</label>
                    <textarea id="itemDesc"></textarea>
                </div>
            </div>
            <div class="preview-area" onclick="document.getElementById('imageFile').click()">
                <div id="previewPlaceholder">📷 לחץ לתמונה</div>
                <img src="" class="preview-img-big" id="previewImgBig">
                <input type="file" id="imageFile" accept="image/*" style="display:none" onchange="handleFile(this)">
                <input type="hidden" id="itemBase64">
            </div>
        </div>
        <button id="addBtn" onclick="addItem()" class="btn-add">➕ הוסף ושמור לענן</button>
        <button id="updateBtn" onclick="updateItem()" class="btn-update">💾 שמור שינויים בענן</button>
        <button id="cancelBtn" onclick="resetForm()" style="display:none; margin-top:5px; cursor:pointer;">ביטול</button>
    </div>

    <hr style="margin: 30px 0;">
    <div id="accordion-container"></div>
</div>

<script>
    // --- הגדרות GITHUB - שנה את אלו! ---
    const GITHUB_TOKEN = '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';
    const REPO_OWNER = 'BigDadies-55';
    const REPO_NAME = 'NewRest';
    const FILE_PATH = 'menu_db.json';

    let menuItems = [];
    let currentSHA = "";

    // טעינה מ-GitHub
    async function loadFromGitHub() {
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        try {
            const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
            const data = await res.json();
            currentSHA = data.sha;
            menuItems = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            document.getElementById('statusMsg').innerText = "✅ מחובר ומסונכרן לענן";
            render();
        } catch (e) {
            document.getElementById('statusMsg').innerText = "❌ שגיאה בחיבור לענן";
        }
    }

    // שמירה ל-GitHub
    async function saveToGitHub() {
        document.getElementById('statusMsg').innerText = "⏳ שומר נתונים לענן...";
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(menuItems, null, 2))));
        
        const res = await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: "Update menu", content, sha: currentSHA })
        });

        if (res.ok) {
            const data = await res.json();
            currentSHA = data.content.sha;
            document.getElementById('statusMsg').innerText = "✅ נשמר בהצלחה!";
            render();
        } else {
            alert("שגיאת סנכרון");
        }
    }

    // טיפול בתמונה ודחיסה
    function handleFile(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800;
                let width = img.width, height = img.height;
                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                const compressed = canvas.toDataURL('image/jpeg', 0.6);
                document.getElementById('itemBase64').value = compressed;
                showPreview(compressed);
            };
        };
        reader.readAsDataURL(file);
    }

    function showPreview(src) {
        const img = document.getElementById('previewImgBig');
        const ph = document.getElementById('previewPlaceholder');
        if(src) { img.src = src; img.style.display = 'block'; ph.style.display = 'none'; }
        else { img.style.display = 'none'; ph.style.display = 'block'; }
    }

    function render() {
        const container = document.getElementById('accordion-container');
        container.innerHTML = "";
        const grouped = menuItems.reduce((acc, i) => { acc[i.category] = acc[i.category] || []; acc[i.category].push(i); return acc; }, {});
        ["ראשונות", "עיקריות", "קינוחים", "שתייה"].forEach(cat => {
            const items = grouped[cat] || [];
            const groupDiv = document.createElement('div');
            groupDiv.className = "category-group";
            groupDiv.innerHTML = `<div class="category-header" onclick="this.parentElement.classList.toggle('active')"><span>${cat} (${items.length})</span><span>▼</span></div>
                <div class="category-content">${items.map(item => `
                    <div class="item-row">
                        <img src="${item.image || ''}" class="item-img" onerror="this.src='https://via.placeholder.com/50'">
                        <div class="item-info"><strong>${item.name}</strong> - ₪${item.price}</div>
                        <button onclick="startEdit(${item.id})" style="width:auto; cursor:pointer; background:#f39c12; color:white; border:none; padding:5px; border-radius:4px;">ערוך</button>
                        <button onclick="deleteItem(${item.id})" style="width:auto; cursor:pointer; background:#e74c3c; color:white; border:none; padding:5px; border-radius:4px; margin-right:5px;">מחק</button>
                    </div>`).join('')}</div>`;
            container.appendChild(groupDiv);
        });
    }

    function addItem() {
        const name = document.getElementById('itemName').value;
        const price = document.getElementById('itemPrice').value;
        const category = document.getElementById('itemCategory').value;
        const desc = document.getElementById('itemDesc').value;
        const image = document.getElementById('itemBase64').value;
        if(!name || !price) return alert("מלא פרטים");
        menuItems.push({ id: Date.now(), name, price, category, desc, image });
        saveToGitHub();
        resetForm();
    }

    function startEdit(id) {
        const item = menuItems.find(i => i.id === id);
        document.getElementById('editId').value = item.id;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemCategory').value = item.category;
        document.getElementById('itemDesc').value = item.desc || '';
        document.getElementById('itemBase64').value = item.image || '';
        showPreview(item.image);
        document.getElementById('addBtn').style.display = 'none';
        document.getElementById('updateBtn').style.display = 'block';
        document.getElementById('cancelBtn').style.display = 'block';
    }

    function updateItem() {
        const id = parseInt(document.getElementById('editId').value);
        const idx = menuItems.findIndex(i => i.id === id);
        if(idx !== -1) {
            menuItems[idx] = { ...menuItems[idx], name: document.getElementById('itemName').value, price: document.getElementById('itemPrice').value, category: document.getElementById('itemCategory').value, desc: document.getElementById('itemDesc').value, image: document.getElementById('itemBase64').value };
            saveToGitHub();
            resetForm();
        }
    }

    function deleteItem(id) { if(confirm("למחוק?")) { menuItems = menuItems.filter(i => i.id !== id); saveToGitHub(); } }
    function resetForm() {
        document.getElementById('editId').value = ''; document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = ''; document.getElementById('itemDesc').value = '';
        document.getElementById('itemBase64').value = ''; showPreview('');
        document.getElementById('addBtn').style.display = 'block';
        document.getElementById('updateBtn').style.display = 'none';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    loadFromGitHub();
</script>
</body>
</html>
