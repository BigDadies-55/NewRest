<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול תפריט - דחיסת תמונות ותצוגה גדולה</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 20px; direction: rtl; color: #333; }
        .admin-card { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* עיצוב הטופס והתמונה */
        .form-and-preview { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 25px; background: #fafafa; padding: 20px; border-radius: 15px; border: 1px solid #eaeaea; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        
        /* תצוגה מקדימה גדולה */
        .preview-area { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #ddd; border-radius: 10px; background: #fff; padding: 10px; min-height: 150px; cursor: pointer; position: relative; overflow: hidden; }
        .preview-area:hover { border-color: #3498db; background: #f4fafd; }
        .preview-img-big { max-width: 100%; max-height: 250px; border-radius: 8px; display: none; }
        .preview-placeholder { color: #888; text-align: center; font-size: 0.9em; }
        .preview-status { position: absolute; bottom: 5px; background: rgba(39, 174, 96, 0.8); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; display: none; }

        .btn-add { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 1.1em; }
        .btn-update { background: #2980b9; color: white; display: none; }

        /* אקורדיון */
        .category-group { margin-top: 10px; border: 1px solid #eee; border-radius: 10px; overflow: hidden; }
        .category-header { background: #34495e; color: white; padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .category-content { display: none; background: white; padding: 10px; }
        .category-group.active .category-content { display: block; }
        .item-row { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #f1f1f1; }
        .item-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; margin-left: 15px; background: #f9f9f9; }
        .item-info { flex-grow: 1; }
        
        .btn-sm { width: auto; padding: 6px 12px; margin-right: 5px; cursor: pointer; border: none; border-radius: 5px; color: white; font-size: 0.85em; }
        .btn-edit { background: #f39c12; }
        .btn-del { background: #e74c3c; }
        .btn-cancel { background: #95a5a6; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>🍽️ ניהול תפריט - גרסה מותאמת לביצועים</h2>

    <div id="editor-form">
        <input type="hidden" id="editId">
        <div class="form-and-preview">
            
            <div class="form-grid">
                <div>
                    <label>שם המנה:</label>
                    <input type="text" id="itemName" placeholder="למשל: סושי קליפורניה">
                </div>
                <div>
                    <label>מחיר (₪):</label>
                    <input type="number" id="itemPrice" placeholder="0.00">
                </div>
                <div>
                    <label>קטגוריה:</label>
                    <select id="itemCategory">
                        <option value="ראשונות">ראשונות</option>
                        <option value="עיקריות">עיקריות</option>
                        <option value="קינוחים">קינוחים</option>
                        <option value="שתייה">שתייה</option>
                    </select>
                </div>
            </div>

            <div class="preview-area" onclick="document.getElementById('imageFile').click()">
                <div class="preview-placeholder" id="previewPlaceholder">
                    <span style="font-size:2em">📷</span><br>
                    לחץ להעלאת תמונה
                </div>
                <img src="" class="preview-img-big" id="previewImgBig">
                <div class="preview-status" id="previewStatus">תמונה נדחסה</div>
                <input type="file" id="imageFile" accept="image/*" style="display:none" onchange="handleFileSelect(this)">
                <input type="hidden" id="itemBase64">
            </div>

        </div>

        <button id="addBtn" onclick="addItem()" class="btn-add">➕ הוסף מנה חדשה</button>
        <button id="updateBtn" onclick="updateItem()" class="btn-add btn-update">💾 שמור שינויים במנה</button>
        <button id="cancelBtn" onclick="resetForm()" class="btn-sm btn-cancel" style="display:none; margin-top:8px;">ביטול</button>
    </div>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eaeaea;">

    <div id="accordion-container">
        </div>

    <div style="margin-top: 25px; display: flex; gap: 10px; background: #eee; padding: 15px; border-radius: 10px;">
        <button onclick="saveToFile()" style="background:#34495e; color:white; font-size:0.9em;">💾 הורד קובץ בסיס נתונים (JSON)</button>
        <input type="file" id="loadInput" style="display:none" onchange="loadFromFile(this)">
        <button onclick="document.getElementById('loadInput').click()" style="background:#7f8c8d; color:white; font-size:0.9em;">📂 טען קובץ קיים</button>
    </div>
</div>

<script>
    let menuItems = JSON.parse(localStorage.getItem('restaurantMenu')) || [];

    // --- לוגיקת תמונה: דחיסה ותצוגה גדולה ---
    function handleFileSelect(input) {
        const file = input.files[0];
        if (!file) return;

        // 1. תצוגה מקדימה מהירה של הקובץ המקורי
        const reader = new FileReader();
        reader.onload = function(e) {
            showBigPreview(e.target.result);
            // 2. הפעלת מנגנון הדחיסה
            compressImage(e.target.result);
        };
        reader.readAsDataURL(file);
    }

    function showBigPreview(src) {
        const img = document.getElementById('previewImgBig');
        const placeholder = document.getElementById('previewPlaceholder');
        if(src) {
            img.src = src;
            img.style.display = 'block';
            placeholder.style.display = 'none';
        } else {
            img.src = '';
            img.style.display = 'none';
            placeholder.style.display = 'block';
        }
    }

    // פונקציית דחיסת תמונה (Canvas)
    function compressImage(base64Str) {
        const img = new Image();
        img.src = base64Str;
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // הגדרות דחיסה
            const MAX_WIDTH = 800; // רוחב מקסימלי לתמונה בתפריט
            let width = img.width;
            let height = img.height;

            // חישוב פרופורציות
            if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;

            // ציור התמונה מחדש על Canvas בגודל המוקטן
            ctx.drawImage(img, 0, 0, width, height);

            // ייצוא התמונה המכווצת (איכות 0.6 = 60%)
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
            document.getElementById('itemBase64').value = compressedBase64;
            document.getElementById('previewStatus').style.display = 'block';
        };
    }

    // --- פונקציות הליבה של הניהול ---
    function render() {
        const container = document.getElementById('accordion-container');
        container.innerHTML = "";

        const grouped = menuItems.reduce((acc, item) => {
            acc[item.category] = acc[item.category] || [];
            acc[item.category].push(item);
            return acc;
        }, {});

        const categories = ["ראשונות", "עיקריות", "קינוחים", "שתייה"];

        categories.forEach(cat => {
            const items = grouped[cat] || [];
            if (items.length === 0 && menuItems.length > 0) return;

            const groupDiv = document.createElement('div');
            groupDiv.className = "category-group";
            groupDiv.innerHTML = `
                <div class="category-header" onclick="this.parentElement.classList.toggle('active')">
                    <span>${cat} (${items.length} מנות)</span>
                    <span>▼</span>
                </div>
                <div class="category-content">
                    ${items.map(item => `
                        <div class="item-row">
                            <img src="${item.image || ''}" class="item-img" onerror="this.src='https://via.placeholder.com/50?text=? '">
                            <div class="item-info">
                                <strong>${item.name}</strong> - ₪${item.price}
                            </div>
                            <button class="btn-sm btn-edit" onclick="startEdit(${item.id})">ערוך</button>
                            <button class="btn-sm btn-del" onclick="deleteItem(${item.id})">מחק</button>
                        </div>
                    `).join('')}
                    ${items.length === 0 ? '<p style="color:#999; font-size:0.8em; text-align:center;">אין מנות בקטגוריה זו</p>' : ''}
                </div>
            `;
            container.appendChild(groupDiv);
        });

        localStorage.setItem('restaurantMenu', JSON.stringify(menuItems));
    }

    function addItem() {
        const name = document.getElementById('itemName').value;
        const price = document.getElementById('itemPrice').value;
        const category = document.getElementById('itemCategory').value;
        const image = document.getElementById('itemBase64').value;

        if(!name || !price) return alert("חובה למלא שם ומחיר");

        menuItems.push({ id: Date.now(), name, price, category, image });
        resetForm();
        render();
    }

    function startEdit(id) {
        const item = menuItems.find(i => i.id === id);
        if(!item) return;

        document.getElementById('editId').value = item.id;
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemCategory').value = item.category;
        document.getElementById('itemBase64').value = item.image || '';
        
        // הצגת התמונה המקסימלית בעריכה
        if(item.image) {
            showBigPreview(item.image);
            document.getElementById('previewStatus').innerText = "תמונה קיימת";
            document.getElementById('previewStatus').style.display = 'block';
        } else {
            showBigPreview('');
        }

        document.getElementById('addBtn').style.display = 'none';
        document.getElementById('updateBtn').style.display = 'block';
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateItem() {
        const id = parseInt(document.getElementById('editId').value);
        const index = menuItems.findIndex(i => i.id === id);
        if(index !== -1) {
            menuItems[index].name = document.getElementById('itemName').value;
            menuItems[index].price = document.getElementById('itemPrice').value;
            menuItems[index].category = document.getElementById('itemCategory').value;
            menuItems[index].image = document.getElementById('itemBase64').value;
            resetForm();
            render();
        }
    }

    function deleteItem(id) {
        if(confirm("למחוק מנה זו?")) {
            menuItems = menuItems.filter(i => i.id !== id);
            render();
        }
    }

    function resetForm() {
        document.getElementById('editId').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemBase64').value = '';
        document.getElementById('imageFile').value = '';
        showBigPreview('');
        document.getElementById('previewStatus').style.display = 'none';
        
        document.getElementById('addBtn').style.display = 'block';
        document.getElementById('updateBtn').style.display = 'none';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    function saveToFile() {
        const data = JSON.stringify(menuItems);
        const blob = new Blob([data], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'menu_db.json';
        a.click();
    }

    function loadFromFile(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                menuItems = JSON.parse(e.target.result);
                render();
            } catch(err) {
                alert("קובץ לא תקין");
            }
        };
        reader.readAsText(input.files[0]);
    }

    render();
</script>
</body>
</html>
