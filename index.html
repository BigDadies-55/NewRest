<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOJI - Japanese Art Dining</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a35d;
            --gold-light: #e0c084;
            --gold-dark: #8b6f3e;
            --bg: #0a0a0a;
            --bg-elevated: #161616;
            --bg-card: #1a1a1a;
            --text: #f0ebe0;
            --text-muted: #8a857a;
            --border: #2a2620;
        }
        body { 
            font-family: 'Heebo', sans-serif; 
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at top, rgba(201, 163, 93, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(201, 163, 93, 0.03) 0%, transparent 50%);
            color: var(--text); 
            margin: 0; direction: rtl; text-align: center; 
            padding-bottom: 100px; min-height: 100vh;
        }
        
        header { 
            padding: 24px 30px; 
            background: 
                radial-gradient(ellipse at center top, rgba(255, 240, 215, 0.2) 0%, transparent 70%),
                linear-gradient(180deg, #b89868 0%, #c9a878 50%, #b89868 100%);
            border-bottom: 1px solid #7a5f33;
            position: relative;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }
        header::after {
            content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);
            width: 100px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(58, 45, 24, 0.6), transparent);
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1100px;
            margin: 0 auto;
            gap: 30px;
        }
        .header-text {
            text-align: right;
            flex: 1;
            min-width: 0;
        }
        .header-right-group {
            display: flex;
            align-items: flex-end;
            gap: 32px;
            flex-shrink: 0;
        }
        .logo-link {
            display: block;
            cursor: pointer;
            transition: 0.3s ease;
            text-decoration: none;
        }
        .logo-link:hover { transform: scale(1.05); }
        .logo-link:active { transform: scale(0.97); }
        .logo-img { 
            height: 130px; 
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
        }
        .main-title { 
            font-family: 'Cormorant Garamond', serif; margin: 0; 
            font-size: 2.8rem; letter-spacing: 9px; 
            font-weight: 600;
            color: #2a1f0f; 
            text-shadow: 0 1px 0 rgba(255, 240, 215, 0.25);
            line-height: 1;
        }
        .address-text { 
            font-size: 1.1rem; 
            color: #2a1f0f; 
            margin: 0 0 -10px 0; 
            font-weight: 500; 
            letter-spacing: 1.2px;
            text-align: right;
            line-height: 1.4;
            max-width: 180px;
            text-shadow: 0 1px 0 rgba(255, 240, 215, 0.2);
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        /* === דף בית - מסך קטגוריות === */
        .home-intro {
            margin: 50px 0 40px;
            padding: 30px 20px;
            position: relative;
        }
        .home-intro-label {
            color: var(--gold); font-size: 0.85rem; 
            letter-spacing: 4px; font-weight: 300; text-transform: uppercase;
            margin-bottom: 15px; opacity: 0.8;
        }
        .home-intro-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            letter-spacing: 6px;
            color: var(--text);
            margin: 0;
            text-transform: uppercase;
        }
        .home-intro-ornament {
            display: flex; align-items: center; justify-content: center;
            gap: 15px; margin-top: 20px;
        }
        .home-intro-ornament::before, .home-intro-ornament::after {
            content: ''; flex: 0 1 100px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
        }
        .home-intro-ornament span { color: var(--gold); font-size: 1rem; }

        /* כרטיסי קטגוריות גדולים */
        .categories-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 30px; 
            margin: 0 auto;
            animation: pageEnter 0.5s ease;
        }
        
        .category-tile { 
            border-radius: 12px; 
            cursor: pointer; 
            transition: 0.4s ease;
            background: 
                linear-gradient(#0d0d0d, #0d0d0d) padding-box,
                linear-gradient(135deg, var(--gold-light) 0%, var(--gold-dark) 30%, var(--gold) 60%, var(--gold-dark) 100%) border-box;
            border: 2px solid transparent;
            box-shadow: 
                0 6px 25px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(224, 192, 132, 0.1);
            position: relative;
            overflow: hidden;
            min-height: 280px;
        }
        /* תמונת רקע של הקטגוריה */
        .tile-image {
            position: absolute; inset: 0;
            background-size: cover;
            background-position: center;
            background-color: #0d0d0d;
            transition: 0.6s ease;
            z-index: 0;
        }
        /* כיסוי כהה לקריאות הטקסט */
        .tile-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, 
                rgba(0,0,0,0.25) 0%, 
                rgba(0,0,0,0.5) 50%, 
                rgba(0,0,0,0.88) 100%);
            transition: 0.4s ease;
            z-index: 1;
        }
        .tile-content {
            position: relative; z-index: 2;
            padding: 40px 25px 35px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            min-height: 276px;
            text-align: center;
        }
        .category-tile::before {
            content: ''; position: absolute; inset: 0; border-radius: 10px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
            pointer-events: none; z-index: 3;
        }
        /* מסגרת זהב פנימית עדינה */
        .category-tile::after {
            content: ''; position: absolute; inset: 15px;
            border: 1px solid rgba(201, 163, 93, 0.3);
            border-radius: 6px;
            pointer-events: none;
            transition: 0.4s ease;
            z-index: 3;
        }
        .category-tile:hover { 
            transform: translateY(-6px);
            background: 
                linear-gradient(#0d0d0d, #0d0d0d) padding-box,
                linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-light) 100%) border-box;
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.7), 
                0 0 30px rgba(201, 163, 93, 0.3),
                inset 0 1px 0 rgba(224, 192, 132, 0.2);
        }
        .category-tile:hover .tile-image { transform: scale(1.08); }
        .category-tile:hover .tile-overlay {
            background: linear-gradient(180deg, 
                rgba(0,0,0,0.15) 0%, 
                rgba(0,0,0,0.4) 50%, 
                rgba(0,0,0,0.85) 100%);
        }
        .category-tile:hover::after {
            border-color: rgba(201, 163, 93, 0.6);
            inset: 12px;
        }

        .tile-corner-tl, .tile-corner-tr, .tile-corner-bl, .tile-corner-br {
            position: absolute; width: 25px; height: 25px;
            border-color: var(--gold); opacity: 0.8; z-index: 4;
        }
        .tile-corner-tl { top: 20px; right: 20px; border-top: 1px solid; border-right: 1px solid; }
        .tile-corner-tr { top: 20px; left: 20px; border-top: 1px solid; border-left: 1px solid; }
        .tile-corner-bl { bottom: 20px; right: 20px; border-bottom: 1px solid; border-right: 1px solid; }
        .tile-corner-br { bottom: 20px; left: 20px; border-bottom: 1px solid; border-left: 1px solid; }

        .tile-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.1rem;
            letter-spacing: 6px;
            font-weight: 600;
            color: var(--gold-light);
            margin: 0 0 15px;
            text-shadow: 
                0 2px 4px rgba(0,0,0,0.8),
                0 0 20px rgba(201, 163, 93, 0.4);
            text-transform: uppercase;
        }
        .tile-divider {
            width: 50px; height: 1px;
            background: var(--gold);
            margin: 0 auto 15px;
            opacity: 0.8;
            box-shadow: 0 0 8px rgba(201, 163, 93, 0.5);
        }
        .tile-count {
            color: #d4cbb8;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .tile-arrow {
            color: var(--gold); font-size: 1.2rem; margin-top: 18px;
            transition: 0.3s; opacity: 0.8;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .category-tile:hover .tile-arrow { transform: translateX(-8px); opacity: 1; }

        /* === דף קטגוריה === */
        .page { animation: pageEnter 0.5s ease; }
        @keyframes pageEnter {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: transparent;
            border: 1px solid rgba(201, 163, 93, 0.3);
            color: var(--gold-light);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin: 25px 0 10px;
            transition: 0.3s;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .back-btn:hover { 
            background: rgba(201, 163, 93, 0.1); 
            border-color: var(--gold); color: var(--gold);
        }

        .page-header { margin: 0 0 40px; padding: 25px 20px 30px; position: relative; }
        .page-header::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 40px; height: 40px;
            border-top: 1px solid var(--gold); border-right: 1px solid var(--gold);
            opacity: 0.4;
        }
        .page-header::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 40px; height: 40px;
            border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold);
            opacity: 0.4;
        }
        .page-title {
            font-family: 'Cormorant Garamond', serif; font-size: 3.2rem; letter-spacing: 10px;
            font-weight: 600;
            color: var(--gold); margin: 0; text-shadow: 0 0 30px rgba(201, 163, 93, 0.3);
            text-transform: uppercase;
        }
        .page-ornament { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 20px; }
        .page-ornament::before, .page-ornament::after {
            content: ''; flex: 0 1 130px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
        }
        .page-ornament span { color: var(--gold); font-size: 1rem; opacity: 0.9; }
        .page-subtitle {
            color: var(--text-muted); font-size: 0.85rem; letter-spacing: 3px; 
            margin-top: 15px; font-weight: 300; text-transform: uppercase;
        }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .card { 
            border-radius: 10px; overflow: hidden; 
            display: flex; flex-direction: column; cursor: pointer; transition: 0.4s ease;
            background: 
                linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
                linear-gradient(135deg, var(--gold-light) 0%, var(--gold-dark) 30%, var(--gold) 60%, var(--gold-dark) 100%) border-box;
            border: 1.5px solid transparent;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(224, 192, 132, 0.1);
            position: relative;
        }
        .card::before {
            content: ''; position: absolute; inset: 0; border-radius: 9px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4); pointer-events: none; z-index: 1;
        }
        .card:hover { 
            transform: translateY(-5px);
            background: 
                linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
                linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-light) 100%) border-box;
            box-shadow: 0 10px 35px rgba(0,0,0,0.7), 0 0 25px rgba(201, 163, 93, 0.25), inset 0 1px 0 rgba(224, 192, 132, 0.2);
        }

        .img-box { height: 200px; overflow: hidden; background: #0d0d0d; border-bottom: 1px solid var(--border); position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s ease; }
        .card:hover .img-box img { transform: scale(1.05); }
        .img-box::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 70%, rgba(0,0,0,0.4) 100%); pointer-events: none; }
        
        .content { padding: 18px 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .type-labels { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
        .type-tag { 
            font-size: 0.65rem; background: rgba(201, 163, 93, 0.1); padding: 3px 10px; 
            border-radius: 4px; color: var(--gold-light); font-weight: 700; 
            border: 1px solid rgba(201, 163, 93, 0.3); letter-spacing: 0.5px;
        }
        .card-name { font-family: 'Cormorant Garamond', serif; margin: 8px 0; font-size: 1.35rem; color: var(--text); letter-spacing: 1.5px; font-weight: 600; }
        .card-desc { font-size: 0.85rem; color: var(--text-muted); margin: 5px 0 15px 0; line-height: 1.5; height: 2.8em; overflow: hidden; }
        .price { 
            font-weight: 700; font-size: 1.2rem; margin-top: auto; padding-top: 12px; 
            border-top: 1px dashed var(--border); color: var(--gold); font-family: 'Cormorant Garamond', serif;
        }

        .floating-actions {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 100;
            background: rgba(20, 20, 20, 0.95); padding: 8px 12px; border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 20px rgba(201, 163, 93, 0.1);
            backdrop-filter: blur(15px); border: 1px solid rgba(201, 163, 93, 0.25); 
            max-width: calc(100vw - 30px);
        }
        .action-btn { 
            text-decoration: none; font-weight: 600; font-size: 0.85rem; 
            display: flex; align-items: center; gap: 6px; padding: 9px 16px; 
            border-radius: 30px; transition: 0.3s; letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .btn-order-float { 
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%); 
            color: #000; box-shadow: 0 4px 15px rgba(201, 163, 93, 0.3);
        }
        .btn-map-float {
            background: rgba(201, 163, 93, 0.15);
            color: var(--gold-light);
            border: 1px solid rgba(201, 163, 93, 0.5);
        }
        .btn-map-float:hover { background: rgba(201, 163, 93, 0.25); color: var(--gold); }
        .btn-phone-float { background: transparent; color: var(--gold-light); border: 1px solid rgba(201, 163, 93, 0.4); }
        .btn-phone-float:hover { background: rgba(201, 163, 93, 0.1); }
        .action-btn:active { transform: scale(0.95); }

        /* === תצוגה מקדימה === */
        .product-modal {
            display: none; position: fixed; inset: 0; background: var(--bg);
            background-image: 
                radial-gradient(ellipse at top, rgba(201, 163, 93, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at bottom, rgba(201, 163, 93, 0.04) 0%, transparent 60%);
            z-index: 2000; overflow-y: auto; animation: fadeIn 0.3s ease;
        }
        .product-modal.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-close {
            position: fixed; top: 20px; right: 20px;
            background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(201, 163, 93, 0.3);
            width: 44px; height: 44px; border-radius: 50%; font-size: 1.3rem;
            cursor: pointer; z-index: 2100; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            color: var(--gold-light); transition: 0.3s; backdrop-filter: blur(10px);
        }
        .modal-close:hover { background: var(--gold); color: #000; transform: rotate(90deg); border-color: var(--gold); }

        .modal-content { 
            max-width: 700px; 
            margin: 30px auto 100px; 
            animation: slideUp 0.4s ease;
            border-radius: 14px;
            background: 
                linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
                linear-gradient(135deg, var(--gold-light) 0%, var(--gold-dark) 30%, var(--gold) 60%, var(--gold-dark) 100%) border-box;
            border: 2px solid transparent;
            overflow: hidden;
            box-shadow: 
                0 15px 50px rgba(0,0,0,0.8), 
                0 0 40px rgba(201, 163, 93, 0.15),
                inset 0 1px 0 rgba(224, 192, 132, 0.15);
            position: relative;
        }
        .modal-content::before {
            content: ''; position: absolute; inset: 0; border-radius: 12px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
            pointer-events: none; z-index: 5;
        }
        .modal-content::after {
            content: ''; position: absolute; inset: 12px; border-radius: 8px;
            border: 1px solid rgba(201, 163, 93, 0.2);
            pointer-events: none; z-index: 4;
        }
        /* פינות זהב דקורטיביות */
        .modal-corner-tl, .modal-corner-tr, .modal-corner-bl, .modal-corner-br {
            position: absolute; width: 22px; height: 22px;
            border-color: var(--gold); opacity: 0.7; z-index: 6;
        }
        .modal-corner-tl { top: 18px; right: 18px; border-top: 1px solid; border-right: 1px solid; }
        .modal-corner-tr { top: 18px; left: 18px; border-top: 1px solid; border-left: 1px solid; }
        .modal-corner-bl { bottom: 18px; right: 18px; border-bottom: 1px solid; border-right: 1px solid; }
        .modal-corner-br { bottom: 18px; left: 18px; border-bottom: 1px solid; border-left: 1px solid; }

        .modal-img-wrap { width: 100%; height: 55vh; min-height: 300px; max-height: 460px; overflow: hidden; background: #000; position: relative; }
        .modal-img-wrap img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
        .modal-img-wrap::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
            background: linear-gradient(to top, var(--bg-card) 0%, transparent 100%); pointer-events: none;
        }
        .modal-body { padding: 30px 30px 45px; text-align: center; position: relative; z-index: 3; }
        .modal-types { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
        .modal-type-tag {
            font-size: 0.75rem; background: rgba(201, 163, 93, 0.1); padding: 5px 14px;
            border-radius: 20px; color: var(--gold-light); font-weight: 700;
            border: 1px solid rgba(201, 163, 93, 0.4); letter-spacing: 1px;
        }
        .modal-name {
            font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; margin: 10px 0 5px;
            letter-spacing: 4px; font-weight: 600;
            color: var(--gold); text-shadow: 0 0 30px rgba(201, 163, 93, 0.3);
        }
        .modal-divider { display: flex; align-items: center; justify-content: center; margin: 20px auto; gap: 12px; }
        .modal-divider::before, .modal-divider::after {
            content: ''; width: 50px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .modal-divider span { color: var(--gold); font-size: 0.7rem; letter-spacing: 3px; }
        .modal-desc {
            font-size: 1.05rem; color: var(--text); line-height: 1.8;
            margin: 18px auto 30px; max-width: 500px; font-weight: 300; opacity: 0.85;
        }
        .modal-price-box {
            display: inline-block; padding: 18px 50px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 1px solid var(--gold-dark); border-radius: 12px; margin-top: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(201, 163, 93, 0.1);
        }
        .modal-price-label { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px; }
        .modal-price {
            font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; font-weight: 700;
            color: var(--gold); letter-spacing: 3px; text-shadow: 0 0 20px rgba(201, 163, 93, 0.3);
        }

        .image-zoom { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 3000; justify-content: center; align-items: center; cursor: zoom-out; }
        .image-zoom.show { display: flex; }
        .image-zoom img { max-width: 95%; max-height: 90vh; border-radius: 8px; border: 1px solid rgba(201, 163, 93, 0.3); }

        @media (max-width: 600px) {
            header { padding: 18px 18px; }
            .header-content { gap: 14px; }
            .header-right-group { gap: 20px; }
            .logo-img { height: 85px; }
            .main-title { font-size: 1.7rem; letter-spacing: 5px; }
            .address-text { 
                font-size: 0.85rem; letter-spacing: 0.8px; 
                margin-bottom: -6px; max-width: 130px;
            }
            .tile-name { font-size: 1.4rem; letter-spacing: 3px; }
            .category-tile { padding: 40px 20px; min-height: 180px; }
            .page-title { font-size: 1.9rem; letter-spacing: 5px; }
            .page-ornament::before, .page-ornament::after { flex: 0 1 70px; }
            .modal-name { font-size: 1.7rem; letter-spacing: 2px; }
            .modal-price { font-size: 2rem; }
            .modal-img-wrap { height: 50vh; min-height: 280px; }
            .modal-body { padding: 20px 18px 40px; }
            .floating-actions { gap: 6px; padding: 7px 10px; }
            .action-btn { font-size: 0.78rem; padding: 8px 12px; gap: 4px; }
        }
        @media (max-width: 380px) {
            .logo-img { height: 70px; }
            .main-title { font-size: 1.4rem; letter-spacing: 4px; }
            .address-text { font-size: 0.75rem; max-width: 110px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <div class="header-text">
            <h1 id="mainTitle" class="main-title"></h1>
        </div>
        <div class="header-right-group">
            <div id="mainAddress" class="address-text"></div>
            <a href="#" onclick="renderHome(); return false;" class="logo-link" aria-label="חזרה לדף הבית">
                <img id="mainLogo" src="" class="logo-img">
            </a>
        </div>
    </div>
</header>

<div class="container">
    <div id="view-display"></div>
</div>

<div class="floating-actions" id="floating-bar"></div>

<div id="productModal" class="product-modal">
    <button class="modal-close" onclick="closeProduct()">✕</button>
    <div class="modal-content">
        <span class="modal-corner-tl"></span>
        <span class="modal-corner-tr"></span>
        <span class="modal-corner-bl"></span>
        <span class="modal-corner-br"></span>
        <div class="modal-img-wrap">
            <img id="modalImg" src="" onclick="zoomImage(this.src)">
        </div>
        <div class="modal-body">
            <div class="modal-types" id="modalTypes"></div>
            <h2 class="modal-name" id="modalName"></h2>
            <div class="modal-divider"><span>◆</span></div>
            <p class="modal-desc" id="modalDesc"></p>
            <div class="modal-price-box">
                <div class="modal-price-label">מחיר</div>
                <div class="modal-price" id="modalPrice"></div>
            </div>
        </div>
    </div>
</div>

<div id="imageZoom" class="image-zoom" onclick="this.classList.remove('show')">
    <img id="zoomImg">
</div>

<script>
    const REPO = 'BigDadies-55/NewRest';
    const DB_URL = `https://raw.githubusercontent.com/${REPO}/main/menu_db.json`;
    let db = { settings: {}, categories: [], items: [] };
    let currentView = 'home'; // 'home' או 'category'
    let currentCat = "";

    async function load() {
        try {
            const res = await fetch(`${DB_URL}?v=${Date.now()}`);
            db = await res.json();
            
            document.getElementById('mainTitle').innerText = db.settings.name || "";
            document.getElementById('mainAddress').innerText = db.settings.address || "";
            if(db.settings.logo) document.getElementById('mainLogo').src = `https://raw.githubusercontent.com/${REPO}/main/images/${db.settings.logo}`;
            
            let barHtml = "";
            if (db.settings.phone) barHtml += `<a href="tel:${db.settings.phone}" class="action-btn btn-phone-float">📞 התקשרו</a>`;
            if (db.settings.mapLink) barHtml += `<a href="${db.settings.mapLink}" target="_blank" class="action-btn btn-map-float">📍 נווט</a>`;
            if (db.settings.orderLink) barHtml += `<a href="${db.settings.orderLink}" target="_blank" class="action-btn btn-order-float">🛵 הזמנה</a>`;
            document.getElementById('floating-bar').innerHTML = barHtml;

            renderHome();
        } catch(e) { console.error(e); }
    }

    function renderHome() {
        currentView = 'home';
        const tilesHtml = db.categories.map(cat => {
            const catItems = db.items.filter(i => i.category == cat);
            // תמונה: מ-settings.categoryImages אם הוגדר, אחרת מהמנה הראשונה
            let imageFile = null;
            if (db.settings.categoryImages && db.settings.categoryImages[cat]) {
                imageFile = db.settings.categoryImages[cat];
            } else if (catItems.length > 0 && catItems[0].image) {
                imageFile = catItems[0].image;
            }
            const imageUrl = imageFile 
                ? `https://raw.githubusercontent.com/${REPO}/main/images/${imageFile}` 
                : '';
            const bgStyle = imageUrl ? `background-image: url('${imageUrl}')` : '';
            
            return `
                <div class="category-tile" onclick="openCategory('${cat}')">
                    <div class="tile-image" style="${bgStyle}"></div>
                    <div class="tile-overlay"></div>
                    <span class="tile-corner-tl"></span>
                    <span class="tile-corner-tr"></span>
                    <span class="tile-corner-bl"></span>
                    <span class="tile-corner-br"></span>
                    <div class="tile-content">
                        <h2 class="tile-name">${cat}</h2>
                        <div class="tile-divider"></div>
                        <div class="tile-arrow">←</div>
                    </div>
                </div>`;
        }).join('');

        document.getElementById('view-display').innerHTML = `
            <div style="height: 30px;"></div>
            <div class="categories-grid">${tilesHtml}</div>
        `;
    }

    function openCategory(cat) {
        currentView = 'category';
        currentCat = cat;
        const items = db.items.filter(i => i.category == cat);
        
        const itemsHtml = items.length === 0 
            ? '<p style="grid-column:1/-1; opacity:0.5; padding: 40px;">אין מנות בקטגוריה זו.</p>'
            : items.map((i, idx) => `
                <div class="card" onclick="openProduct(${idx})">
                    <div class="img-box"><img src="https://raw.githubusercontent.com/${REPO}/main/images/${i.image}" loading="lazy"></div>
                    <div class="content">
                        <div class="type-labels">${(i.types || []).map(t => `<span class="type-tag">${t}</span>`).join('')}</div>
                        <h3 class="card-name">${i.name}</h3>
                        <p class="card-desc">${i.desc || 'מנה יפנית מסורתית מחומרי הגלם הטריים ביותר.'}</p>
                        <div class="price">₪${i.price}</div>
                    </div>
                </div>`).join('');

        document.getElementById('view-display').innerHTML = `
            <div class="page">
                <button class="back-btn" onclick="renderHome()">→ חזרה לתפריט</button>
                <div class="page-header">
                    <h2 class="page-title">${cat}</h2>
                    <div class="page-ornament"><span>◆</span></div>
                    <div class="page-subtitle">${items.length} מנות מיוחדות</div>
                </div>
                <div class="menu-grid">${itemsHtml}</div>
            </div>`;
        
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function openProduct(idx) {
        const items = db.items.filter(i => i.category == currentCat);
        const item = items[idx];
        if (!item) return;
        document.getElementById('modalImg').src = `https://raw.githubusercontent.com/${REPO}/main/images/${item.image}`;
        document.getElementById('modalName').innerText = item.name;
        document.getElementById('modalDesc').innerText = item.desc || 'מנה יפנית מסורתית מחומרי הגלם הטריים ביותר, מוגשת באומנות יפנית עתיקה.';
        document.getElementById('modalPrice').innerText = `₪${item.price}`;
        document.getElementById('modalTypes').innerHTML = (item.types || []).map(t => `<span class="modal-type-tag">${t}</span>`).join('');
        document.getElementById('productModal').classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeProduct() {
        document.getElementById('productModal').classList.remove('show');
        document.body.style.overflow = '';
    }

    function zoomImage(src) {
        document.getElementById('zoomImg').src = src;
        document.getElementById('imageZoom').classList.add('show');
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (document.getElementById('imageZoom').classList.contains('show')) {
                document.getElementById('imageZoom').classList.remove('show');
            } else if (document.getElementById('productModal').classList.contains('show')) {
                closeProduct();
            } else if (currentView === 'category') {
                renderHome();
            }
        }
    });
    
    load();
</script>
</body>
</html>
