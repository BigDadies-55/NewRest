<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOJI - Japanese Art Dining</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #b38e5d; --bg: #fcfbf7; --text: #1a1a1a; }
        body { font-family: 'Assistant', sans-serif; background: var(--bg); color: var(--text); margin: 0; direction: rtl; }
        header { padding: 30px; text-align: center; background: #fff; border-bottom: 1px solid #eee; }
        .sub-menu { display: flex; overflow-x: auto; background: #fff; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #eee; padding: 10px; }
        .filter-btn { background: none; border: none; padding: 10px 20px; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .filter-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; border: 1px solid #f0f0f0; }
        .img-wrapper { height: 200px; background: #eee; overflow: hidden; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .content { padding: 15px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-family: 'Cinzel', serif; margin: 5px 0; font-size: 1.1rem; }
        
        /* עיצוב תגיות סוג מנה */
        .type-labels { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; min-height: 20px; }
        .type-tag { font-size: 0.7rem; background: #e8f5e9; padding: 2px 8px; border-radius: 4px; color: #2e7d32; font-weight: bold; border: 1px solid #c8e6c9; }
        
        .desc { font-size: 0.85rem; color: #666; height: 3.2em; overflow: hidden; margin: 10px 0; }
        .price { font-weight: 700; margin-top: auto; border-top: 1px dashed #eee; padding-top: 10px; font-size: 1rem; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal img { max-width: 90%; max-height: 80%; object-fit: cover; border: 2px solid var(--gold); }
    </style>
</head>
<body>
<header>
    <img src="https://www.koji-sushi.co.il/wp-content/uploads/2024/05/%D7%9C%D7%95%D7%92%D7%95-03.png" style="width:70px;"><br>
    <div style="color:var(--gold); font-style:italic; font-size: 0.9rem; margin-top: 5px;">Japanese Dining Experience</div>
</header>
<nav class="sub-menu" id="filter-nav"></nav>
<div class="container"><div id="menu-display" class="menu-grid"></div></div>
<div id="imageModal" class="modal" onclick="this.classList.remove('show')"><img id="fullImg"></div>

<script>
    const REPO_OWNER = 'BigDadies-55';
    const REPO_NAME = 'NewRest';
    const DB_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/menu_db.json`;
    const IMG_BASE = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/images/`;

    let db = { categories: [], items: [] };
    let currentCat = '';

    async function load() {
        try {
            const res = await fetch(`${DB_URL}?v=${Date.now()}`);
            db = await res.json();
            
            if (db.categories.length > 0) {
                currentCat = db.categories[0];
                renderFilters();
                renderItems();
            }
        } catch(e) { console.error("Error loading menu:", e); }
    }

    function renderFilters() {
        document.getElementById('filter-nav').innerHTML = db.categories.map(c => 
            `<button class="filter-btn ${c===currentCat?'active':''}" onclick="setCat('${c}',this)">${c}</button>`).join('');
    }

    function renderItems() {
        const filtered = db.items.filter(i => i.category === currentCat);
        document.getElementById('menu-display').innerHTML = filtered.map(i => {
            const imgSrc = i.image ? IMG_BASE + i.image : 'https://via.placeholder.com/500x300';
            return `
            <div class="card" onclick="openM('${imgSrc}')">
                <div class="img-wrapper"><img src="${imgSrc}" loading="lazy"></div>
                <div class="content">
                    <div class="type-labels">
                        ${(i.types || []).map(t => `<span class="type-tag">${t}</span>`).join('')}
                    </div>
                    <h3 class="card-title">${i.name}</h3>
                    <p class="desc">${i.desc || 'מנה יפנית מסורתית המוכנת מחומרי הגלם האיכותיים ביותר.'}</p>
                    <div class="price">₪${i.price}</div>
                </div>
            </div>`;
        }).join('');
    }

    function setCat(c, b) { 
        currentCat = c; 
        document.querySelectorAll('.filter-btn').forEach(btn=>btn.classList.remove('active')); 
        b.classList.add('active'); 
        renderItems(); 
    }
    
    function openM(s) { 
        document.getElementById('fullImg').src = s; 
        document.getElementById('imageModal').classList.add('show'); 
    }
    
    load();
</script>
</body>
</html>
