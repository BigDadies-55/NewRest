<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Signature - תפריט שף</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Assistant:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --dark: #1a1a1a;
            --light: #f9f9f9;
            --text: #333;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--light);
            margin: 0;
            color: var(--text);
            line-height: 1.6;
        }

        /* Hero Section */
        header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 100px 20px;
            text-align: center;
            border-bottom: 5px solid var(--gold);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5em;
            letter-spacing: 5px;
            margin: 0;
            text-transform: uppercase;
        }

        header p {
            font-size: 1.2em;
            font-weight: 200;
            letter-spacing: 2px;
            margin-top: 10px;
            color: var(--gold);
        }

        /* Sub-Menu Navigation */
        .sub-menu {
            display: flex;
            justify-content: center;
            background: var(--dark);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .filter-btn {
            background: none;
            border: none;
            color: #888;
            padding: 10px 25px;
            font-family: 'Cinzel', serif;
            font-size: 1.1em;
            cursor: pointer;
            transition: 0.4s;
            position: relative;
        }

        .filter-btn:hover, .filter-btn.active {
            color: var(--gold);
        }

        .filter-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 2px;
            background: var(--gold);
        }

        /* Menu Grid */
        .container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
        }

        /* Card Design */
        .card {
            background: white;
            border: 1px solid #eee;
            overflow: hidden;
            transition: 0.5s;
            position: relative;
        }

        .card:hover {
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transform: translateY(-10px);
        }

        .img-container {
            width: 100%;
            height: 250px;
            overflow: hidden;
            border-bottom: 2px solid var(--gold);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.8s;
        }

        .card:hover img {
            transform: scale(1.1);
        }

        .card-content {
            padding: 25px;
            text-align: center;
        }

        .card-category {
            font-size: 0.8em;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5em;
            margin: 0 0 15px 0;
            color: var(--dark);
        }

        .card-desc {
            font-size: 0.95em;
            color: #777;
            margin-bottom: 20px;
            min-height: 50px;
            font-weight: 300;
        }

        .card-price {
            font-family: 'Cinzel', serif;
            font-size: 1.4em;
            color: var(--dark);
            font-weight: bold;
            display: inline-block;
            border-top: 1px solid var(--gold);
            padding-top: 10px;
            margin-top: 10px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 60px;
            background: var(--dark);
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <h1>The Signature</h1>
    <p>FINE DINING EXPERIENCE</p>
</header>

<nav class="sub-menu">
    <button class="filter-btn active" onclick="filterMenu('הכל', this)">All</button>
    <button class="filter-btn" onclick="filterMenu('ראשונות', this)">Starters</button>
    <button class="filter-btn" onclick="filterMenu('עיקריות', this)">Main Courses</button>
    <button class="filter-btn" onclick="filterMenu('קינוחים', this)">Desserts</button>
    <button class="filter-btn" onclick="filterMenu('שתייה', this)">Drinks</button>
</nav>

<div class="container">
    <div id="menu-display" class="menu-grid">
        </div>
</div>

<footer>
    <p>© 2026 THE SIGNATURE RESTAURANT | CRAFTED FOR EXCELLENCE</p>
</footer>

<script>
    // --- הגדרות GITHUB - עדכן כאן! ---
    const REPO_OWNER = 'BigDadies-55';
    const REPO_NAME = 'NewRest';
    const FILE_PATH = 'menu_db.json';
    
    let allItems = [];

    async function loadData() {
        const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}?v=${new Date().getTime()}`;
        try {
            const response = await fetch(rawUrl);
            allItems = await response.json();
            renderItems(allItems);
        } catch (error) {
            console.error("Error loading menu:", error);
        }
    }

    function renderItems(items) {
        const display = document.getElementById('menu-display');
        display.innerHTML = items.map(item => `
            <div class="card">
                <div class="img-container">
                    <img src="${item.image || 'https://via.placeholder.com/600x400?text=Signature+Dish'}" alt="${item.name}">
                </div>
                <div class="card-content">
                    <div class="card-category">${item.category}</div>
                    <h3 class="card-title">${item.name}</h3>
                    <p class="card-desc">${item.desc || 'A masterfully crafted dish using only the finest seasonal ingredients.'}</p>
                    <div class="card-price">₪${item.price}</div>
                </div>
            </div>
        `).join('');
    }

    function filterMenu(category, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filtered = category === 'הכל' ? allItems : allItems.filter(i => i.category === category);
        renderItems(filtered);
    }

    loadData();
</script>

</body>
</html>
