<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOJI - Japanese Art Dining</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600&family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #b38e5d;
            --gold-dark: #8c6d3f;
            --bg-light: #ffffff;
            --bg-section: #fcfbf7;
            --card-shadow: rgba(0, 0, 0, 0.12);
            --text-dark: #1a1a1a;
            --text-muted: #555555;
        }

        body { font-family: 'Assistant', sans-serif; background-color: var(--bg-section); color: var(--text-dark); margin: 0; padding-bottom: 80px; direction: rtl; }
        header { padding: 30px 15px 15px; text-align: center; background: var(--bg-light); border-bottom: 1px solid #eee; }
        .logo-wrapper { width: 75px; margin: 0 auto 10px; }
        .logo-wrapper img { width: 100%; }
        .slogan { font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.95rem; color: var(--gold); }

        /* ניווט קטגוריות דינמי */
        .sub-menu {
            display: flex; justify-content: flex-start; background: rgba(255, 255, 255, 0.96);
            padding: 10px 0; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid #eee; backdrop-filter: blur(10px);
            overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch;
        }
        .sub-menu::-webkit-scrollbar { display: none; }
        .filter-btn { 
            background: none; border: none; color: var(--text-muted); padding: 10px 20px; 
            font-size: 0.95rem; cursor: pointer; font-weight: 600; transition: 0.3s;
        }
        .filter-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }

        /* כרטיס מנה עם צל */
        .card {
            background: #fff; border-radius: 12px; overflow: hidden;
            box-shadow: 0 8px 20px var(--card-shadow); transition: 0.3s; 
            cursor: pointer; border: 1px solid #f0f0f0; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.18); }
        .img-wrapper { width: 100%; height: 200px; background: #eee; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-content { padding: 20px; text-align: center; flex-grow: 1; }
        .card-title { font-family: 'Cinzel', serif; font-size: 1.2rem; margin: 10px 0; }
        .card-desc { font-size: 0.9rem; color: var(--text-muted); min-height: 2.7em; }
        .card-price { font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700; padding-top: 12px; border-top: 1px dashed #eee; margin-top: 10px; }

        /* מודל תמונה אחיד */
        .modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { width: 90vw; height: 60vh; max-width: 800px; object-fit: cover; border: 2px solid var(--gold); background: #fff; }

        .order-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--text-dark); color: white; padding: 15px; text-align: center; }
        .order-link { color: #fff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<header>
    <div class="logo-wrapper"><img src="https://www.koji-sushi.co.il/wp-content/uploads/2024/05/%D7%9C%D7%95%D7%92%D7%95-03.png" alt="KOJI"></div>
    <div class="slogan">Japanese food | חוויה קולינרית יפנית</div>
</header>

<nav class="sub-menu" id="filter-nav"></nav>

<div class="container">
    <div id="menu-display" class="menu-grid"></div>
</div>

<div id="imageModal" class="modal" onclick="closeModal()"><img class="modal-content" id="fullImage"></div>

<div class="order-bar">
    <a href="tel:0501234567" class="order-link">להזמנות: 050-1234567</a>
</div>

<script>
    const REPO_OWNER = 'BigDadies-55';
    const REPO_NAME = 'NewRest';
    const FILE_PATH = 'menu_db.json';
    const IMAGE_FOLDER = 'images';

    let db = { categories: [], items: [] };
    let currentCategory = '';

    async function loadData() {
        const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}?v=${Date.now()}`;
        try {
            const res = await fetch(rawUrl);
            const data = await res.json();
            
            if (Array.isArray(data)) {
                db.items = data;
                db.categories = [...new Set(data.map(i => i.category))];
            } else {
                db = data;
            }

            if (db.categories.length > 0) currentCategory = db.categories[0];
            
            renderFilters();
            renderItems();
        } catch (e) { console.error("Error loading menu:", e); }
    }

    function renderFilters() {
        const nav = document.getElementById('filter-nav');
        nav.innerHTML = db.categories.map(cat => `
            <button class="filter-btn ${cat === currentCategory ? 'active' : ''}" 
                    onclick="switchCat('${cat}', this)">${cat}</button>
        `).join('');
    }

    function renderItems() {
        const display = document.getElementById('menu-display');
        const filtered = db.items.filter(i => i.category === currentCategory);
        
        display.innerHTML = filtered.map(item => {
            const imgSrc = item.image ? `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${IMAGE_FOLDER}/${item.image}` : '';
            return `
            <div class="card" onclick="openModal('${imgSrc}')">
                <div class="img-wrapper"><img src="${imgSrc || 'https://via.placeholder.com/500x300'}" loading="lazy"></div>
                <div class="card-content">
                    <h3 class="card-title">${item.name}</h3>
                    <p class="card-desc">${item.desc || ''}</p>
                    <div class="card-price">₪${item.price}</div>
                </div>
            </div>`;
        }).join('');
    }

    function switchCat(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderItems();
    }

    function openModal(src) {
        if(!src) return;
        document.getElementById('fullImage').src = src;
        document.getElementById('imageModal').classList.add('show');
    }

    function closeModal() { document.getElementById('imageModal').classList.remove('show'); }

    loadData();
</script>
</body>
</html>
